<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Developer Cashflow Survival Simulator</title>
<style>
:root{--bg:#0b0e13;--panel:#121722;--line:#243044;--ink:#e8ecf3;--dim:#8794ab;--amber:#ffb020;--red:#ff4d4d;--green:#35d08a;--blue:#4aa3ff;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;--sans:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 85% -10%,#1c2433 0,transparent 60%),var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px);z-index:0}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{margin:0;font-size:1.55rem;letter-spacing:.2px}
h1 small{display:block;font:500 .72rem var(--mono);color:var(--amber);letter-spacing:.18em;text-transform:uppercase;margin-bottom:4px}
.sub{color:var(--dim);max-width:62ch;margin:.4rem 0 0;font-size:.92rem}
button{font:600 .9rem var(--sans);cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:6px}
button:hover{border-color:var(--amber)}
button.go{background:var(--amber);color:#1a1200;border-color:var(--amber)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.warn{margin:14px 0;padding:10px 14px;border:1px dashed #6b5a2a;background:#1a1608;color:#e9d9a6;border-radius:6px;font-size:.85rem}
.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px}
.grid>*{min-width:0}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.card h2{margin:0 0 10px;font:600 .78rem var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.f{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:8px;align-items:center;margin:6px 0;font-size:.88rem}
.f input{width:100%;background:#0b0f16;border:1px solid var(--line);color:var(--ink);padding:5px 7px;border-radius:5px;font:.88rem var(--mono);direction:ltr;text-align:right}
.f input:focus{outline:1px solid var(--amber)}
.hint{color:var(--dim);font-size:.75rem}
.gauge{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.big{font:700 3.6rem/1 var(--mono);direction:ltr}
.big.low{color:var(--green)}.big.mid{color:var(--amber)}.big.high{color:var(--red)}
.verdict{font-size:1.05rem}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.kv div{background:#0d121b;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kv b{display:block;font:700 1.15rem var(--mono);direction:ltr;text-align:start}
.kv span{color:var(--dim);font-size:.75rem}
svg{width:100%;height:auto;display:block;direction:ltr;unicode-bidi:isolate}
svg text{font-family:var(--mono);font-size:11px;fill:var(--dim)}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center}
td.n,th.n{font-family:var(--mono);direction:ltr}
.heat td{font-family:var(--mono);direction:ltr;color:#071016;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--dim);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-inline-end:5px}
.err{color:var(--red);font-family:var(--mono);margin:6px 0}
.busy{opacity:.5;pointer-events:none}
footer{margin-top:26px;color:var(--dim);font-size:.8rem;border-top:1px solid var(--line);padding-top:12px}
a{color:var(--blue)}
bdi{unicode-bidi:isolate}
.grp{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.grp>h3{margin:0 0 6px;font:600 .82rem var(--sans);color:var(--amber)}
.rad{display:flex;gap:6px 16px;flex-wrap:wrap;margin:6px 0;font-size:.86rem}
.rad label,.chk>label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.rad input,.chk input[type=checkbox]{accent-color:var(--amber);width:16px;height:16px;margin:0}
.chk{margin:10px 0 2px;font-size:.88rem}
.chk>label{font-weight:600}
.indent{margin-inline-start:22px;border-inline-start:2px solid var(--line);padding-inline-start:10px}
.f input:disabled{opacity:.5;border-style:dashed;cursor:not-allowed}
.off{opacity:.5}
.conf{margin:8px 0 0;padding:7px 10px;border:1px dashed #6b5a2a;background:#1a1608;color:#e9d9a6;border-radius:6px;font-size:.8rem}
.conf.bad{border-color:#7a2e2e;background:#1f0d0d;color:#ffb4b4}
.conf:empty{display:none}
.split{display:flex;height:22px;border-radius:5px;overflow:hidden;direction:ltr;border:1px solid var(--line);margin:8px 0 4px}
.split i{display:block;height:100%}
.split i:nth-child(1){background:#4aa3ff}.split i:nth-child(2){background:#ffb020}.split i:nth-child(3){background:#35d08a}.split i:nth-child(4){background:#b58cff}
.legend2{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:.76rem;color:var(--dim)}
.legend2 b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:4px;vertical-align:-1px}
.dv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:.84rem}
.dv span:nth-child(odd){color:var(--dim)}
.dv span:nth-child(even){font-family:var(--mono);direction:ltr;text-align:end}
.pos{color:var(--green)}.neg{color:var(--red)}
.plan{border:1px solid var(--line);border-radius:8px;padding:8px;margin:8px 0;background:#0d121b}
.prow{display:flex;gap:6px}
.prow .pn{flex:1;min-width:0}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.pgrid label{display:flex;flex-direction:column;gap:2px;font-size:.7rem;color:var(--dim)}
.pgrid input,.pgrid select,.prow input{background:#0b0f16;border:1px solid var(--line);color:var(--ink);padding:4px;border-radius:4px;font:.82rem var(--mono);width:100%;min-width:0}
#heat{overflow-x:auto}
.lb{display:block;min-width:0;overflow-wrap:anywhere}.lb b{font-weight:600}
.un{display:block;font:.68rem var(--mono);color:var(--blue);margin-top:1px}
.q{font:700 .72rem var(--sans);width:18px;height:18px;line-height:14px;padding:0;margin-inline:5px;border-radius:50%;border:1.5px solid var(--blue);background:transparent;color:var(--blue);vertical-align:middle;cursor:help}
.q:hover,.q:focus{background:var(--blue);color:#0b0e13;outline:none}
.grp>h3 .q,th .q{margin-inline:3px}
.tip{position:absolute;z-index:50;background:#0b0f16;color:var(--ink);border:1px solid var(--amber);font:400 .8rem/1.5 var(--sans);padding:8px 10px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.5);pointer-events:none;white-space:normal;text-align:start;text-transform:none;letter-spacing:0}
@media print{.q,.tip{display:none!important}}
.heat td.na{background:#243044;color:var(--dim)}
@media print{
 :root{--bg:#fff;--panel:#fff;--line:#bbb;--ink:#111;--dim:#555}
 body{background:#fff}body:before{display:none}
 .tools,#inputs,#runrow{display:none!important}
 .grid{display:block}.card{break-inside:avoid;border-color:#bbb}
 .big.low{color:#0a7a46}.big.mid{color:#a86b00}.big.high{color:#c00}
 .kv div{background:#fff}.heat td{color:#000}
 svg text{fill:#333}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1><small id="t_kicker"></small><span id="t_title"></span></h1>
    <p class="sub" id="t_sub"></p>
  </div>
  <div class="tools">
    <button id="lang">EN</button>
    <button id="pdf"></button>
  </div>
</header>
<div class="warn" id="t_warn"></div>

<div class="warn" id="imp" style="display:none"></div>

<div class="grid">
  <div id="inputs">
    <div class="card" id="c_pricing"></div>
    <div class="card" id="c_plan"></div>
    <div class="card"><h2 id="t_inputs"></h2><div id="fields"></div>
      <div class="f"><span class="lb"><b id="t_land"></b><button type="button" class="q" data-h="land"></button><small class="un" data-u="land"></small></span><input id="land_up" type="number" step="any" value="0" min="0"></div>
      <div class="f"><span class="lb"><b id="t_paths"></b><button type="button" class="q" data-h="paths"></button><small class="un" data-u="paths"></small></span><input id="paths" type="number" value="2000" min="100" max="20000"></div>
      <div class="f"><span class="lb"><b id="t_seed"></b><button type="button" class="q" data-h="seed"></button><small class="un" data-u="seed"></small></span><input id="seed" type="number" value="7"></div>
      <div class="f"><span class="lb"><b id="t_target"></b><button type="button" class="q" data-h="target"></button><small class="un" data-u="target"></small></span><input id="target" type="number" value="10" min="0" max="100"></div>
      <div id="runrow" style="margin-top:10px;display:flex;gap:8px"><button class="go" id="run"></button><button id="reset"></button></div>
      <div class="err" id="err"></div>
    </div>
    <div class="card"><h2 id="t_xray_in"></h2>
      <div class="f"><span class="lb"><b id="t_rate"></b><button type="button" class="q" data-h="rate"></button><small class="un" data-u="rate"></small></span><input id="rate" type="number" value="27"></div>
      <div id="plans"></div>
      <button id="addplan" style="margin-top:6px"></button>
    </div>
  </div>

  <div id="out">
    <div class="card" id="c_verdict">
      <h2 id="t_verdict"></h2>
      <div class="gauge"><div class="big" id="pbig">–</div><div class="verdict" id="pverd"></div></div>
      <div class="kv" id="kv"></div>
    </div>
    <div class="card"><h2 id="t_fan"></h2><svg id="fan" viewBox="0 0 760 300"></svg>
      <div class="legend"><span><i style="background:rgba(74,163,255,.18)"></i><span id="l_b90"></span></span><span><i style="background:rgba(74,163,255,.38)"></i><span id="l_b50"></span></span><span><i style="background:var(--amber)"></i><span id="l_med"></span></span><span><i style="background:var(--red)"></i><span id="l_line"></span></span></div>
    </div>
    <div class="card"><h2 id="t_torn"></h2><p class="hint" id="t_torn_h"></p><svg id="torn" viewBox="0 0 760 290"></svg></div>
    <div class="card"><h2 id="t_heat"></h2><p class="hint" id="t_heat_h"></p><div id="heat"></div>
      <p id="maxterm" style="margin-top:10px"></p></div>
    <div class="card"><h2 id="t_xray"></h2><p class="hint" id="t_xray_h"></p><div id="xray"></div></div>
  </div>
</div>
<p class="noprint" style="margin-top:14px"><a id="t_back" href="https://islamelsabahy.github.io/land-deal-lab/" style="color:var(--amber)"></a></p>
<footer id="t_foot"></footer>
</div>
<script src="survival.js"></script>

var tipEl=null,tipBtn=null;
function hideTip(){if(tipEl){tipEl.remove();tipEl=null;tipBtn=null}}
function showTip(btn,text){
  hideTip();tipBtn=btn;
  tipEl=document.createElement("div");tipEl.className="tip";tipEl.setAttribute("role","tooltip");tipEl.textContent=text;document.body.appendChild(tipEl);
  var r=btn.getBoundingClientRect(),w=Math.min(280,window.innerWidth-16);tipEl.style.width=w+"px";
  var left=Math.max(8,Math.min(window.innerWidth-w-8,r.left+r.width/2-w/2));
  tipEl.style.left=left+"px";tipEl.style.top=(r.bottom+window.scrollY+6)+"px";
}
function bindHelp(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-h]"),function(b){
    var h=HELP[b.dataset.h];if(!h){b.remove();return}
    var txt=h[lang==="ar"?0:1],pinned=false;
    b.textContent=lang==="ar"?"؟":"?";b.setAttribute("aria-label",lang==="ar"?"شرح":"Help");
    b.onclick=function(e){e.preventDefault();e.stopPropagation();if(tipBtn===b&&pinned){pinned=false;hideTip()}else{pinned=true;showTip(b,txt)}};
    b.onmouseenter=function(){if(!tipEl)showTip(b,txt)};
    b.onmouseleave=function(){if(!pinned)hideTip()};
    b.onblur=function(){pinned=false;hideTip()};
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-u]"),function(e){
    var u=UNIT[e.dataset.u];if(u)e.textContent=u[lang==="ar"?0:1];else e.remove();
  });
}

  var inp=function(e){var v=Number(e.value);ST[e.dataset.k]=isFinite(v)?v:0;refreshPlan()};
  Array.prototype.forEach.call(document.querySelectorAll("#c_pricing input[data-k],#c_plan input[data-k]"),function(e){e.oninput=function(){inp(e)}});
  Array.prototype.forEach.call(document.querySelectorAll("#c_pricing input[type=radio],#c_plan input[type=radio]"),function(e){e.onchange=function(){ST[e.name]=e.name==="freq"?Number(e.value):e.value;refreshPlan()}});
  Array.prototype.forEach.call(document.querySelectorAll("#c_plan input[type=checkbox]"),function(e){e.onchange=function(){ST[e.dataset.c]=e.checked;refreshPlan()}});
  bindHelp();refreshPlan();
}
function setDis(ids,dis){ids.forEach(function(id){var e=$(id);if(e){e.disabled=dis;if(e.parentNode&&e.parentNode.classList)e.parentNode.classList.toggle("off",dis)}})}
function refreshPlan(){
  var notes=[],bad=false;
  // pricing: the non-chosen price field is read-only and shows the derived value
  var m2=ST.basis==="m2";
  if(m2) ST.price_unit=Math.round(ST.area*ST.price_m2)/1e6; else ST.price_m2=ST.area>0?Math.round(ST.price_unit*1e6/ST.area):0;
  [["s_price_m2",ST.price_m2],["s_price_unit",ST.price_unit]].forEach(function(x){var e=$(x[0]);if(e!==document.activeElement)e.value=x[1]});
  setDis(["s_price_unit"],m2); setDis(["s_price_m2"],!m2);
  setDis(["s_growth"],ST.policy!=="esc");
  // yearly payments conflict with annual installments / short terms
  var blBlock=ST.freq===12||ST.term<12;
  if(blBlock&&ST.bl_on){ST.bl_on=false;$("s_bl_on").checked=false;notes.push(t(ST.freq===12?"conf_bl_year":"conf_bl_term"))}
  $("s_bl_on").disabled=blBlock;
  if(blBlock&&!notes.length) notes.push(t(ST.freq===12?"conf_bl_year":"conf_bl_term"));
  ["dl","bl","cash","mt"].forEach(function(k){var on=ST[k+"_on"];Array.prototype.forEach.call($("b_"+k).querySelectorAll("input"),function(e){e.disabled=!on||(k==="bl"&&blBlock);if(e.parentNode.classList)e.parentNode.classList.toggle("off",e.disabled)})});
  $("b_mt").style.display=ST.mt_on?"":"none"; 
  ["dl","bl","cash"].forEach(function(k){$("b_"+k).style.display=ST[k+"_on"]?"":"none"});
  if(ST.term<ST.freq){notes.push(t("conf_term"));bad=true}
  var down=ST.down,dl=ST.dl_on?ST.dl:0,bl=ST.bl_on?ST.bl:0,inst=100-down-dl-bl;
  if(inst<-1e-9){notes.push(t("conf_sum"));bad=true}
  if(ST.cash_on) notes.push(t("conf_cash"));
  // composition bar
  var seg=[[down,"s_down"],[Math.max(inst,0),"s_inst"],[bl,"s_year"],[dl,"s_dl"]];
  var tot=seg.reduce(function(a,x){return a+Math.max(x[0],0)},0)||1;
  $("split").innerHTML=seg.map(function(x){return "<i style='width:"+(Math.max(x[0],0)/tot*100)+"%' title='"+esc(t(x[1]))+"'></i>"}).join("");
  var cols=["#4aa3ff","#ffb020","#35d08a","#b58cff"];
  var nI=Math.floor(ST.term/ST.freq)||0,nB=Math.floor(ST.term/12)||0;
  var fl=t("f"+ST.freq);
  var lines=seg.map(function(x,i){return "<span><b style='background:"+cols[i]+"'></b>"+esc(t(x[1]))+" "+ltr(x[0].toFixed(1).replace(/\.0$/,"")+"%")+"</span>"});
  $("legend2").innerHTML=lines.join("");
  var extra=[];
  if(nI>0&&inst>0) extra.push(t("inst_line").replace("{n}",nI).replace("{x}",(inst/nI).toFixed(2)).replace("{f}",fl));
  if(bl>0&&nB>0) extra.push(t("yr_line").replace("{n}",nB).replace("{x}",(bl/nB).toFixed(2)));
  $("conf").className="conf"+(bad?" bad":"");
  $("conf").innerHTML=(extra.length?"<div>"+esc(extra.join(" · "))+"</div>":"")+notes.map(function(n){return "<div>"+esc(n)+"</div>"}).join("");
  // derived economics
  var d=$("derived");
  try{
    var mm=S.metrics(pricingParams());
    var money=function(v){return Math.round(v).toLocaleString("en-US")};
    var gmc=mm.gross_margin<0?"neg":"pos",mc=mm.margin_m2<0?"neg":"pos";
    d.innerHTML=[[t("d_unit"),mm.unit_price.toFixed(3)],[t("d_m2"),money(mm.price_m2)],[t("d_area"),money(mm.total_area)],[t("d_gdv"),mm.gdv.toFixed(1)],
      [t("d_cost"),money(mm.cost_m2)],[t("d_margin"),"<span class='"+mc+"'>"+money(mm.margin_m2)+"</span>"],[t("d_be"),money(mm.breakeven_m2)],[t("d_gm"),"<span class='"+gmc+"'>"+(mm.gross_margin*100).toFixed(1)+"%</span>"]]
      .map(function(r){return "<span>"+esc(r[0])+"</span><span>"+(String(r[1]).indexOf("<span")===0?r[1]:esc(r[1]))+"</span>"}).join("");
  }catch(e){d.innerHTML="<span>"+esc(e.message)+"</span><span></span>"}
}
function pricingParams(){
  var m2=ST.basis==="m2",p={};
  ORDER.forEach(function(k){var e=$("p_"+k);if(e)p[k]=Number(e.value)});
  p.area=ST.area; p.price_by_m2=m2?1:0; p.price_m2=ST.price_m2; p.price=ST.price_unit;
  p.price_growth=ST.policy==="esc"?ST.growth/100:0;
  p.down_pct=ST.down/100; p.term=ST.term; p.freq=ST.freq;
  p.delivery_pct=ST.dl_on?ST.dl/100:0; p.balloon_pct=ST.bl_on?ST.bl/100:0;
  p.cash_share=ST.cash_on?ST.cs/100:0; p.cash_discount=ST.cash_on?ST.cd/100:0;
  p.maint_pct=ST.mt_on?ST.mp/100:0; p.maint_counted=ST.mt_on&&ST.mt_mode==="count"?1:0;
  return p;
}
function buildPlans(){
  var fsel=function(i,v){return "<select class='pv' data-i='"+i+"' data-k='freq'>"+[1,3,6,12].map(function(f){return "<option value='"+f+"'"+(f===v?" selected":"")+">"+esc(t("f"+f))+"</option>"}).join("")+"</select>"};
  var h=plans.map(function(p,i){
    var num=function(k,label,v,step){var hk={down_pct:"dp",term:"term",grace:"grace",delivery_pct:"dlp",delivery_month:"dm"}[k];return "<label>"+esc(label)+qh(hk)+"<input class='pv' type='number' step='"+(step||"any")+"' data-i='"+i+"' data-k='"+k+"' value='"+v+"'></label>"};
    return "<div class='plan'><div class='prow'><input class='pn' dir='ltr' data-i='"+i+"' value='"+esc(p.name)+"'><button class='rm' data-i='"+i+"' style='padding:2px 8px'>×</button></div>"+
     "<div class='pgrid'>"+num("down_pct",t("dp"),p.down_pct*100)+num("term",t("term"),p.term,1)+"<label>"+esc(t("fq"))+qh("fq")+fsel(i,p.freq||1)+"</label>"+
     num("grace",t("grace"),p.grace||0,1)+num("delivery_pct",t("dlp"),(p.delivery_pct||0)*100)+num("delivery_month",t("dm")+" (0=end)",p.delivery_month||0,1)+"</div></div>";}).join("");
  $("plans").innerHTML=h;bindHelp();
  Array.prototype.forEach.call(document.querySelectorAll(".pn"),function(e){e.oninput=function(){plans[e.dataset.i].name=e.value;renderXray()}});
  Array.prototype.forEach.call(document.querySelectorAll(".pv"),function(e){e.oninput=e.onchange=function(){var v=Number(e.value),k=e.dataset.k;plans[e.dataset.i][k]=(k==="down_pct"||k==="delivery_pct")?v/100:v;renderXray()}});
  Array.prototype.forEach.call(document.querySelectorAll(".rm"),function(e){e.onclick=function(){plans.splice(Number(e.dataset.i),1);buildPlans();renderXray()}});
}
function applyText(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  $("lang").textContent=lang==="ar"?"EN":"عربي";
  var map={t_kicker:"kicker",t_title:"title",t_sub:"sub",t_warn:"warn",t_inputs:"inputs",t_paths:"paths",t_seed:"seed",t_target:"target",run:"run",reset:"reset",pdf:"pdf",
   t_xray_in:"xray_in",t_land:"land",t_back:"back",t_rate:"rate",addplan:"addplan",t_verdict:"verdict",t_fan:"fan",t_torn:"torn",t_torn_h:"torn_h",t_heat:"heat",t_heat_h:"heat_h",t_xray:"xray",t_xray_h:"xray_h",t_foot:"foot",
   l_b90:"b90",l_b50:"b50",l_med:"med",l_line:"line"};
  Object.keys(map).forEach(function(id){$(id).textContent=t(map[id])});
  Array.prototype.forEach.call(document.querySelectorAll("[data-l]"),function(e){e.textContent=L[e.dataset.l][lang]});
  Array.prototype.forEach.call(document.querySelectorAll("[data-t]"),function(e){e.textContent=t(e.dataset.t)});
  document.title=lang==="ar"?"محاكي بقاء السيولة للمطور":"Developer Cashflow Survival Simulator";
  bindHelp();
}
function readParams(){
  var pp=pricingParams(), land=Number($("land_up").value)||0;
  if(land<0) throw new Error(t("land_big").replace("{x}","0"));
  if(land>pp.opening_cash) throw new Error(t("land_big").replace("{x}",(land-pp.opening_cash).toFixed(1)));
  pp.opening_cash=pp.opening_cash-land;
  if(ST.term<ST.freq) throw new Error(t("conf_term"));
  if(ST.down+(ST.dl_on?ST.dl:0)+(ST.bl_on?ST.bl:0)>100+1e-9) throw new Error(t("conf_sum"));
  return S.paramsFrom(pp);
}
var last=null;

function run(){
  $("err").textContent="";
  var p;
  try{p=readParams()}catch(e){$("err").textContent=t("bad")+e.message;return}
  var paths=Math.max(100,Math.min(20000,Math.trunc(Number($("paths").value)||2000)));
  var seed=Math.trunc(Number($("seed").value)||1);
  var target=(Number($("target").value)||10)/100;
  $("out").classList.add("busy"); $("pbig").textContent="…";
  setTimeout(function(){
    try{
      var sim=S.simulate(p,paths,seed,true);
      var torn=S.tornado(p,Math.min(paths,1000),seed,0.2);
      var dps=[0.05,0.10,0.15,0.20,0.30,0.40,0.50];
      var terms=[12,24,36,48,60,84,120];
      var heat=S.heatmap(p,dps,terms,Math.min(paths,300),seed);
      var tl=[]; for(var k=6;k<=120;k+=6) tl.push(k);
      var mt=S.maxTerm(p,target,tl,Math.min(paths,300),seed);
      last={p:p,sim:sim,torn:torn,heat:heat,mt:mt,target:target};
      render();
    }catch(e){$("err").textContent=t("bad")+e.message}
    $("out").classList.remove("busy");
  },30);
}

function render(){
  if(!last) return;
  var sim=last.sim,p=last.p,pr=sim.default_prob;
  var cls=pr<=last.target?"low":pr<=last.target*2.5?"mid":"high";
  $("pbig").className="big "+cls; $("pbig").textContent=pc(pr,1);
  $("pverd").textContent=pr<=last.target?t("safe"):t("danger");
  var worst=0,wi=0; sim.first_breach_hist.forEach(function(c,i){if(c>worst){worst=c;wi=i}});
  var fc=sim.final_cash;
  $("kv").innerHTML=[["median",f1(fc["0.5"])],["p5",f1(fc["0.05"])],["p95",f1(fc["0.95"])],["defaults",sim.defaults+" / "+sim.paths],["firstm",worst?String(wi):"–"]]
   .map(function(r){return "<div><b>"+esc(r[1])+"</b><span>"+esc(t(r[0]))+qh(r[0])+"</span></div>"}).join("");bindHelp();
  drawFan(sim,p); drawTorn(last.torn); drawHeat(last.heat); renderMax(); renderXray();
}

function drawFan(sim,p){
  var W=760,H=300,ml=46,mr=12,mt=10,mb=26,D=p.months,F=sim.fan;
  var lo=Math.min(-p.credit_line*1.1,Math.min.apply(null,F["0.05"])), hi=Math.max.apply(null,F["0.95"]);
  if(hi<=lo) hi=lo+1;
  function X(i){return ml+(W-ml-mr)*i/D}
  function Y(v){return mt+(H-mt-mb)*(1-(v-lo)/(hi-lo))}
  function area(a,b,col){var d="M";for(var i=0;i<=D;i++)d+=X(i)+","+Y(b[i])+" L";for(i=D;i>=0;i--)d+=X(i)+","+Y(a[i])+(i?" L":"");return "<path d='"+d+" Z' fill='"+col+"'/>"}
  function line(a,col,w){var d="";for(var i=0;i<=D;i++)d+=(i?" L":"M")+X(i)+","+Y(a[i]);return "<path d='"+d+"' fill='none' stroke='"+col+"' stroke-width='"+w+"'/>"}
  var s="";
  for(var g=0;g<=4;g++){var v=lo+(hi-lo)*g/4;s+="<line x1='"+ml+"' x2='"+(W-mr)+"' y1='"+Y(v)+"' y2='"+Y(v)+"' stroke='#243044' stroke-dasharray='2 4'/><text x='"+(ml-6)+"' y='"+(Y(v)+4)+"' text-anchor='end'>"+Math.round(v)+"</text>";}
  s+=area(F["0.05"],F["0.95"],"rgba(74,163,255,.18)")+area(F["0.25"],F["0.75"],"rgba(74,163,255,.38)")+line(F["0.5"],"#ffb020",2.2);
  s+="<line x1='"+ml+"' x2='"+(W-mr)+"' y1='"+Y(-p.credit_line)+"' y2='"+Y(-p.credit_line)+"' stroke='#ff4d4d' stroke-width='1.6' stroke-dasharray='6 4'/>";
  if(lo<0&&hi>0) s+="<line x1='"+ml+"' x2='"+(W-mr)+"' y1='"+Y(0)+"' y2='"+Y(0)+"' stroke='#5b6a85'/>";
  for(var m=0;m<=D;m+=Math.max(1,Math.round(D/9))) s+="<text x='"+X(m)+"' y='"+(H-8)+"' text-anchor='middle'>"+m+"</text>";
  $("fan").innerHTML=s;
}

function drawTorn(tn){
  var rows=tn.rows,W=760,rowH=32,top=14,mid=380,sc=Math.max(0.01,Math.max.apply(null,rows.map(function(r){return Math.max(Math.abs(r.p_low-tn.base),Math.abs(r.p_high-tn.base))})));
  var half=250,s="";
  function bar(delta,col,y){var w=Math.abs(delta)/sc*half;var x=delta>=0?mid:mid-w;return "<rect x='"+x+"' y='"+y+"' width='"+Math.max(w,1)+"' height='"+(rowH-12)+"' rx='3' fill='"+col+"'/>"}
  rows.forEach(function(r,i){
    var y=top+i*rowH;
    s+="<text x='8' y='"+(y+13)+"' style='fill:var(--ink);font-family:var(--sans);font-size:12px'>"+esc(DRV[r.driver][lang])+"</text>";
    function cc(d){return d>0?"#ff4d4d":"#35d08a"}
    s+=bar(r.p_low-tn.base,cc(r.p_low-tn.base),y)+bar(r.p_high-tn.base,cc(r.p_high-tn.base),y);
    s+="<text x='"+(W-6)+"' y='"+(y+13)+"' text-anchor='end'>"+pc(r.p_low,0)+" → "+pc(r.p_high,0)+"</text>";
  });
  s+="<line x1='"+mid+"' x2='"+mid+"' y1='4' y2='"+(top+rows.length*rowH)+"' stroke='#8794ab'/>";
  $("torn").setAttribute("viewBox","0 0 760 "+(top+rows.length*rowH+8)); $("torn").innerHTML=s;
}

function heatCol(v){ // green -> amber -> red
  var h=v<=0.5?120-v*2*80:40-(v-0.5)*2*40; return "hsl("+h+",70%,55%)";
}
function drawHeat(h){
  var s="<table class='heat'><tr><th></th>"+h.terms.map(function(k){return "<th class='n'>"+k+" "+t("months")+"</th>"}).join("")+"</tr>";
  h.grid.forEach(function(row,i){s+="<tr><th class='n'>"+Math.round(h.down_pcts[i]*100)+"%</th>"+row.map(function(v){return v===null?"<td class='na'>–</td>":"<td style='background:"+heatCol(v)+"'>"+pc(v,0)+"</td>"}).join("")+"</tr>"});
  $("heat").innerHTML=s+"</table>";
}
function renderMax(){
  var m=last.mt, p=last.p;
  $("maxterm").innerHTML=m.best_term?"<b>"+esc(t("maxterm"))+"</b> "+ltr(m.best_term+" "+t("months"))+" @ "+ltr(Math.round(p.down_pct*100)+"%")+" · "+ltr("≤ "+pc(last.target,0)):"<b>"+esc(t("none"))+"</b>";
}
function renderXray(){
  var rate=(Number($("rate").value)||0)/100, price=S.effectivePrice(last?last.p:S.paramsFrom({})), r;
  try{r=S.planXray(price,rate,plans)}catch(e){$("xray").innerHTML="<div class='err'>"+esc(e.message)+"</div>";return}
  var s="<table><tr><th>"+t("planname")+"</th><th class='n'>"+t("pv")+qh("pv")+"</th><th class='n'>"+t("share")+qh("share")+"</th><th class='n'>"+t("hair")+qh("hair")+"</th></tr>";
  r.rows.forEach(function(x){var col=x.haircut>0.25?"var(--red)":x.haircut>0.12?"var(--amber)":"var(--green)";
    s+="<tr><td><bdi dir='ltr'>"+esc(x.name)+"</bdi></td><td class='n'>"+x.pv.toFixed(2)+"</td><td class='n'>"+pc(x.pv_share,1)+"</td><td class='n' style='color:"+col+"'>"+pc(x.haircut,1)+"</td></tr>"});
  $("xray").innerHTML=s+"</table>";bindHelp();
}

$("run").onclick=run;
$("reset").onclick=function(){ORDER.forEach(function(k){$("p_"+k).value=D[k]});ST=st0();$("land_up").value=0;IMP=null;showImp();buildPricing();plans=JSON.parse(JSON.stringify(PLANS0));buildPlans();run()};
$("lang").onclick=function(){lang=lang==="ar"?"en":"ar";try{localStorage.setItem("surv_lang",lang)}catch(e){}applyText();buildPricing();buildPlans();showImp();render()};
$("addplan").onclick=function(){plans.push({name:"new",down_pct:.15,term:36,grace:0,freq:1,delivery_pct:0,delivery_month:0});buildPlans();renderXray()};
$("rate").oninput=renderXray;
var oldTitle;
$("pdf").onclick=function(){oldTitle=document.title;document.title="survival-report-"+new Date().toISOString().slice(0,10);window.print()};
window.addEventListener("afterprint",function(){if(oldTitle) document.title=oldTitle});

var IMP=null;
function applyImport(){
  var q;try{q=new URLSearchParams(location.search)}catch(e){return}
  if(q.get("from")!=="ldl") return;
  var g=function(k,lo,hi){var v=Number(q.get(k));return isFinite(v)&&q.get(k)!==null&&v>=lo&&v<=hi?v:null};
  var o={pm:g("price_m2",0,1e7),area:g("area",1,1e5),units:g("units",1,1e5),budget:g("budget",0,1e7),months:g("months",1,120),down:g("down",0,100),term:g("term",0,240),
    overhead:g("overhead",0,1e5),velocity:g("velocity",0,1e4),land:g("land",0,1e7),growth:g("growth",0,300),infl:g("infl",0,0.5)};
  var set=function(k,v){if(v!==null){var e=$("p_"+k);if(e)e.value=v}};
  set("units",o.units);set("budget",o.budget);set("months",o.months);set("overhead",o.overhead);set("velocity",o.velocity);set("presold",0);set("infl_mean",o.infl);
  if(o.pm!==null){ST.basis="m2";ST.price_m2=o.pm}
  if(o.area!==null) ST.area=o.area;
  if(o.down!==null) ST.down=o.down;
  if(o.term!==null) ST.term=Math.max(1,o.term);
  if(o.growth!==null&&o.growth>0){ST.policy="esc";ST.growth=o.growth}
  if(o.land!==null){$("land_up").value=o.land;$("p_opening_cash").value=+(o.land+D.opening_cash).toFixed(1)}
  IMP=o;
}
function showImp(){
  var b=$("imp");if(!IMP){b.style.display="none";return}
  b.style.display="";b.textContent=t("imp").replace("{pm}",Math.round(IMP.pm||0).toLocaleString("en-US")).replace("{u}",IMP.units||"–").replace("{b}",IMP.budget||"–").replace("{l}",IMP.land||0).replace("{c}",D.opening_cash);
}
buildFields(); applyImport(); buildPricing(); buildPlans(); applyText(); showImp(); run();
})();
